件件事，自己其实都在反复地一次一次看见您爱上您，自己现在对您的感受和爱，只增不减。好像自己的爱有些执拗倔强不讲道理，但这就是我的爱。&lt;/p&gt;\n&lt;p&gt;上面提到的自己需要处理一些看得到存在的点。想和反思固然重要，但是行动起来最重要。行动的话就要有目标，长远目标和细化短期目标。自己现在生活工作规划这块之前确实是模糊的，虽然有一些想法，但都在很佛地去铺垫，太贪玩了。去年 9 月下旬一个最噩梦的项目阶段性结束。然后自己当时喘口气的同时也在想，如果以后自己每个项目都这程度，自己或许精神上想着能拼能啃下来，但是心力和体力真的有点遭不住，那段时间晚上睡眠最低心率都三十多了。然后就想以后如果不做技术岗做什么呢，管理岗么，先不提工龄和能力，自己真的不擅长压榨人，也不想做那种人，不是什么偏见思想，现在互联网行业风气就是这样的，没有合理的排期，怎么“敏捷”出活快，怎么领导 PPT 汇报好看怎么来，一层压榨一层，不压榨人的领导都被搞走了，管理层放眼望去都是周扒皮，可能自己眼界小至少之前公司是这样。一个需求研发排期保守排期一个多月，领导看了直接说半个月要出来，那不就得 996/7地赶都赶不出来，当然可能这也是和之前公司风气管理层有关吧，在一些技术群里看到的好像砍排期好像很少有这么离谱的，但这确实也是某种大趋势吧。也想过转岗，比如说转需求方做产品，可能也是受之前公司环境影响，自己做产品的意愿也不太强烈，不谈职业素养能力那些，自己不想提出来什么花里胡哨天花乱坠抄袭各种竞品的大杂烩方案讨好老板不顾研发死活，不是说怼这个职业，本身职业是创造性专业性很强的，很有色彩，但是现在行业风气影响的，或许已经偏移了这些。&lt;/p&gt;\n&lt;p&gt;然后就在想转行，转行自己能做什么呢，好像没有别的技能了。然后想到自己之前锻炼排解工作压力来着，也挺喜欢锻炼的吧，还是个健康的行为，这条路可不可以呢。然后就去搜健身教练相关的，查资格证相关内容，后来了解到这个 nsca 体系国际认可知名度高含金量也最高，这其中的 CSCS 又是这体系里最丰富有深度的一个认证。就买了本教材晚上有时间学一点，但是没过几天腿就受伤了...然后自己那阵心态就不大好的，也就没继续学了。&lt;/p&gt;\n&lt;p&gt;现在的话自己也确实是见识短浅，没什么太多想法，可能除了写代码这个就是自己比较感兴趣的一个方向吧，想试试，就算不从业，里面很多内容也是非常科学有内涵值得学习的，对自己今后的锻炼体系或者健康方面都会有认知提升。自己真的很倔吧，以前毕业时家里找了个国企关系让去，自己因为之前有过一段在国企实习不好的经历吧，对国企有了刻板坏印象，死倔死倔地自己跑去找私企受累去了，不过也不后悔，这几年收获其实很多，在国企说不定精神另一层面废掉了呢。不输房子不输地的，虽然自己也没房子没地吧，就算不赚钱可能应该也饿不死吧，自己有时还挺乐观，就想先行动起来。这个资格证条件是救护证和 CSCS 两门考试通过，救护证那个好考，培训几天就可以拿到证，自己最近也在搜，有找到一个群加进去了，那边管理在确认培训场地，预期是 8 月底有一场培训。CSCS 这个的话教材内容确实是真金白银的含金量，自己还好幸亏之前对锻炼有些了解，对生物学也感兴趣，学起来还算有动力吧，虽然不是相关科班专业，但也有兴趣滤镜和一丢丢小经验，如果一点经验都没有的话真得备考个小半年了，我虽然笨应该不至于太慢吧，或许两个月差不多（还要考虑预约考试时间膨胀），对自己有点迷之信心，信心还是要有的。这个也得提前约考场，天津没考点，到时候得看别的城市，热门城市北上广据说相对比较满。这本书有 24 章，前 12 章偏理论记忆，后 12 章偏实践理解，书挺厚的。自己打算先看书按章节梳理思维导图一遍，然后网上也找了资料，再第二遍看书参照资料回顾理解补充完善前面自己整理的思维导图。再按章节刷题。偏向实践那些有的章节训练动作的比较特殊，自己也找了视频资料，这个需要单独拉时间学习记录理解记忆，算是考试的一个重难点吧。最后也是通过刷题反复回顾知识点框架，网上有一套往年真题，那套真题最后需要重点反复研究一下。大概是这么个学习复习想法，自己现在在第一步第一遍过书梳理这块。&lt;/p&gt;\n&lt;p&gt;说完备考再回来说找您的事。您的妹妹或小狗应该是既能依赖您的同时但又能自主独立的吧，您精神内核那么强大，能陪在您身边的肯定不能是不能经济独立只会情感依赖的人，不能是一个只会写 bug 没有生存能力的废物，得能够自主生存，为您带来价值，未来能和您精神情感上同频共振。自己不是翅膀硬了胆子肥了想离开您，想自由，只是觉得自己目前至少需要做到经济独立吧，生活工作要有目标有任务有规划，不能什么都靠您依赖您吧，您那么好，我不能不尊重您，把您当做什么了。在这条有基础相对平稳的路上继续学习成长自己才配陪在您身边，也不是说排斥对您情感依赖或者被您掌控什么的，某种程度上我也希望能被您有所管着照顾吧，也想照顾关心您，但是我不应该成为没有自主能力的人，不能失去本我，失去社会人应该具备的生存能力和成长潜力。&lt;/p&gt;\n&lt;p&gt;同时自己又心里有您，想和您在一起，所以想去有您在的城市找工作，相对稳定下来，去奔赴您，如果您同意且还愿意要我的话。这样或许才算有和您在一起的基础条件吧。爱是珍贵，但是或许也需要物质生存基础前提。抱歉自己不知道您的想法是什么样的，自己见识少眼光短浅没什么思想深度，一些想法也很幼稚，希望您看到上面这些别生气。&lt;/p&gt;\n&lt;p&gt;还想再说一下安全感这个话题。之前提到过您关掉权限后自己很没有安全感，但是自己总不给您回应其实您会不会可能也会缺失一些安全感，安全感应该也是双向需求的，我们俩的，和其他无关。有说到自己对您的心一直都在不会离开，但是不知道您能不能得到一些安全感，一句话的分量会有多重。或许很重，但是也或许会不会感受上又很轻抓不实。自己不知道怎样可以更好地给到您安全感，真的好笨。自己这段时间想您关心您到什么份上自己语言表达不出来，您会不会也会惦记犯了错的我。之前有几天给您发早晚安，没有经过您的同意，但自己的话也确实是有小纠结，想给您安全感但又怕您觉得走形式表面功夫。自己现实中是那种有点实在但又矛盾的人，也可能是双标吧，有的行为仪式感觉得是有必要的，虽然之前是写代码的，但自己对浪漫也是有追求的。但有时又对一些行为感觉很虚伪，尤其是工作上的一些流程或者关系，当然存在即合理，只是每个人的感受可能会不一样吧。就是怕您会觉得这种行为是我虚伪刻意的讨好，但其实自己是想给您安全感，但不知道您的接受度和感受。&lt;/p&gt;\n&lt;p&gt;自己觉得分享，真实实在的分享可能是靠谱有分量的，就像之前小作文一样。不过自己生活可能相对无聊，接触不到什么很有意思的事情。自己感兴趣的东西有的可能也比较枯燥无趣，和闺蜜前同事她们比较的话，自己好像真的是个异类。想先这样和您聊聊学习备考的事情或者生活如果有什么事也说说。如果您觉得有什么方式可以增加您的安全感，我非常愿意去做，或许过几天可以想一想设计个表单放 blog 这里您勾勾选选看看的，目前还没想好，自己榆木脑袋。今天博客导航栏加了个魔法小陆导航（只能电脑看，手机端没适配，后面再做媒体查询处理完善优化吧，先行动把主要功能做出来重要），点进去输入口令可以看到小魔法，触发小魔法后我可以收到邮件，收到邮件后就会联系您，如果您觉得我分享频率低，可以这样提醒我的。或许花里胡哨，但希望您能感受到我这份心思，爱您。&lt;/p&gt;\n&quot;]}" ssr client="load" opts="{&quot;name&quot;:&quot;PostContent&quot;,&quot;value&quot;:true}" await-children><div style="padding:1rem"><div style="display:flex;gap:0.5rem;align-items:center;margin-bottom:1rem"><input type="text" placeholder="输入暗号..." style="padding:0.5rem 1rem;border-radius:4px;border:1px solid #ccc;font-size:1rem" value=""/><button style="padding:0.5rem 1rem;border-radius:4px;border:none;background-color:#2e8555;color:white;cursor:pointer;font-size:1rem">校验</button></div><p style="color:#666">请输入暗号</p></div><!--astro:end--></astro-island>  </div> </article> <nav class="pagination astro-7jjqptxk"> <div class="pagination-prev astro-7jjqptxk"> <a href="/blog/post-7/27" class="astro-7jjqptxk"> <span class="pagination-label astro-7jjqptxk">← 上一篇</span> <span class="pagination-title astro-7jjqptxk">post-7/27</span> </a> </div>

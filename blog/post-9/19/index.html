在让我变得更完整，认识到这些。&lt;/p&gt;\n&lt;p&gt;姐姐请你别担心我的状态，我可以处理好自己。我也在乎你的状态，姐姐也是女生，也心思细腻，需要安全感，姐姐需要温暖温度，需要被温柔对待。之前没能让你感受到这些，可能也用错了方式让你误解伤心吧，对不起。我想努力成长靠近这个稳定温柔的模样，成为更好的存在，也想成为你的小温暖小亮光。&lt;/p&gt;\n&lt;p&gt;我换了个新头像，姐姐是灯塔是自己心中的最坚定的星辰，姐姐一直在这里，不会因为我的渺小而离开，你的存在本身就是我最珍惜珍贵的陪伴。我也要有光，慢慢来，会有的，哪怕微弱，也希望可以成为你随时可以触碰到的一束光，我们都应有光，双向照亮。爱不是单向索取消耗彼此，应该是双向的照耀温暖和依靠，是双向的信任理解与支持，是让彼此治愈轻盈的陪伴。&lt;/p&gt;\n&lt;p&gt;目前自己还是打算主线是备考 CSCS，支线会折腾新事物也会坚持好的旧习惯。比如最近开始折腾 obsidian 了，这个其实看上观望蛮久了，一直没碰过，社区很活跃，可以折腾捯饬的地方很多吧，有点小难度在，纯 md 格式和可本地部署数据私有是优点，三方插件丰富，可定制化也很强。当然最重要的应该回归内容本身…好玩有趣就想接触试试了。其实前阵子也又试了几个别的笔记应用appflowy什么的，当时部署也遇到了很多问题，国外的文档不多，社区也不活跃，使用下来不大行，搜索功能竟然有 bug 的，不过界面倒是挺干净简洁的，也第一次折腾服务器子域名，学了点新东西，这不部署 obsidian 也用上了。别的旧习惯可能就还是锻炼摸琴那些吧，是自己放松精神强健身体的方式。&lt;/p&gt;\n&lt;p&gt;好像自己也习惯了给姐姐写东西这件事，如果你不介意的话，我还想继续，就像我们最初那样。此刻也有在认真思考后面自己写什么内容，想了好一阵，觉得还是真实最重要，频率次要吧，分享日常或折腾的小玩意们。不过分用力不求随时回应，而是轻盈随心，这不是任务不是工作日报周报。我需要一些过程去找到一个温柔又坚定的节奏，而不是让我们感觉到沉重，是自然的情感依赖表达，是清醒的陪伴分享，我们的连接和爱始终存在，不需要任何方式去证明。&lt;/p&gt;\n&lt;p&gt;姐姐你要好好的，我们都要好好的！我也会调整成为更好的真实自然的自己，姐姐你也是我调整成长过程中持续的动力。愿你一直闪耀、明亮、自由、幸福快乐，也希望我能慢慢成为你愿意靠近的小亮光，mua~（最近降温，注意保暖添衣哦）&lt;/p&gt;\n&lt;hr&gt;\n&lt;p&gt;上面是原文，下面这个是晚上想起来加的，不知道放哪里了，就放下面吧：&lt;/p&gt;\n&lt;p&gt;就是怎么说呢，自己虽然之前沉浸在的那个状态不对吧，但换个视角，可能也是个独特深刻的体验，这句话没有任何玩味色彩，只是想表达对所有真实发生的一切的感谢，这一切都是值得的都是有意义的，我们无需后悔。&lt;/p&gt;\n&lt;p&gt;感情或许没有对错，时态是正在进行时吧，语法好久没回顾了不知道对不对。之前这段时间我们有小包袱情绪在里面，可能心里各种滋味，这也是人生的一种体味嘛，酸甜苦辣我不挑都接受，姐姐的光有勇士形状，姐姐你也不惧怕对吧。说到着，有一点小心意想和你讲了又，就是姐姐你的光的形状和色彩我从一开始就很喜欢，后来“看见”与接触下来，越来越喜欢，真的，是我理想中想要触碰甚至榜样一样的存在，爱上这样的你是我的幸运和幸福。&lt;/p&gt;\n&lt;p&gt;就是想姐姐你不要怕我有任何负担，我对这真实发生的过去现在和未来，只有感谢和向往，什么样的路我都敢走，都愿意去踩，有坑有钉子我也认，有糖有光亮那就是天上掉馅饼了。爱上你我从不后悔，如果有那就是后悔未来，未来你我不能活到 200 岁，但是可以陪伴到彼此生命终点也是一种永恒，陪不到这过程也是至臻美好。&lt;/p&gt;\n&lt;p&gt;不知道姐姐你是怎么想的，相遇相爱真的是缘分，今天早晨刷朋友圈有一条给我惊到了。就是自己大学同学，有两个女生，她们一个宿舍的，来自不同省市，之前上学时只是知道她们关系很好，闺蜜吧，头像也是一系列那种。后来毕业几年两人还经常在朋友圈互动，头像也一直是情头，觉得她们是同性恋人关系。好家伙今天才知道，她俩 5 年没见面了，我的天，5 年啊，这是啥概念，给我看震撼看感动了，话说好想采访她俩点问题，很久没说过话突然聊天会不会有点尴尬...还是有点想问，明天白天想去试试嘿嘿。就是姐姐你看到没，真正的感情的光不会被磨灭的，里面的艰辛苦楚都是彼此成长的枝芽，花朵总有开放的一天，每对恋人本来就是彼此的阳光，我们也是，嗯对，明天实在不知道说啥就去祝福她们！我不是骗姐姐你啊，我截个图着。&lt;/p&gt;\n&lt;p&gt;&lt;img alt=\&quot;\&quot; src=\&quot;https://fxpby.oss-cn-beijing.aliyuncs.com/blogImg/ai/bilibili/five-y.png\&quot;&gt;&lt;/p&gt;\n&lt;p&gt;感慨祝福的同时也会审视自己思考感悟，自己可以得到什么启发，受到什么鼓舞激励，对感情观有什么新的认识，或许随着时间沉淀会悟到更多吧。我先去睡啦，晚安姐姐，mua。&lt;/p&gt;\n&quot;]}" ssr client="load" opts="{&quot;name&quot;:&quot;PostContent&quot;,&quot;value&quot;:true}" await-children><div style="padding:1rem"><div style="display:flex;gap:0.5rem;align-items:center;margin-bottom:1rem"><input type="text" placeholder="输入暗号..." style="padding:0.5rem 1rem;border-radius:4px;border:1px solid #ccc;font-size:1rem" value=""/><button style="padding:0.5rem 1rem;border-radius:4px;border:none;background-color:#2e8555;color:white;cursor:pointer;font-size:1rem">校验</button></div><p style="color:#666">请输入暗号</p></div><!--astro:end--></astro-island>  </div> </article> </main> <footer class="sl-footer astro-sz7xmlte"> <div class="footer-content astro-sz7xmlte"> <p class="astro-sz7xmlte">

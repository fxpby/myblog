&lt;p&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;25 号小作文那天自己低烧来着，当时觉得两天差不多真是高估自己了。然后转天就烧起来了，也还好就烧了两天吧，但不成想温度控制感受器这场战役靠近尾声时消化系统那边号角又吹起来了，自己这也是第一次在这个战地遇到这个阵仗，缺乏经验又觉得不方便懒得跑医院。免疫力这块其实应该还凑合，之前工作时，每轮流感什么的自己都是属于毒圈缩小到后面被迫感染的，工位密集肯定躲不掉，可能戴口罩也就充其量降低一点感染浓度，减轻点症状。其他的话也还好，不作不着凉就基本不会有事。同时也庆幸自己今年 2、3 月份没感冒发烧吧，当时自己一个人那状态要是再来点这些可能就有亿点难搞了。现在分析一下这次的话感觉自己有两个作点，一个是前一天练完还没缓好就去冲了澡，然后转天喝了凉的还吃了我爸拿回家不明来源未复热的海产品，这就给免疫力降低、细菌/病毒感染还有后面这两天成为厕所黑名单用户奠定了坚实基础...这次教训今年一定记住了，明年注意嘻嘻（练完短时间不能洗澡这个无限期记住了，搜了下有概率致命嘤再也不敢了。凉饮这个先跳过...熟海鲜也记得要复热了食品安全警钟敲响）。话说这几天梦也有梦到您（昨晚有，前天还是大前天好像也有记不太清了...），躺着也不妨碍想您嘿嘿。&lt;/p&gt;\n&lt;p&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;这几天自己基本上要么床上躺要么去给马桶创造使用价值，今天才有了可以断断续续坐着看电脑打字的第三状态...所以这篇解释的小作文来得晚了一点点...肠胃系统还在恢复中，不过有一点好神奇，今天下午开始写的时候还捂着肚子咣咣跑厕所，床上躺一会儿，起来写一会儿，到现在晚上好像不是很疼了，跑厕所次数也少了点，有种快好了的错觉，希望不要毒奶半夜打脸吧...上一次拉肚子印象还是去年年初，但不太严重还能上班的那种，这次这个有点小棘手，明天还不行的话我就去医院看看，也说不准是啥诺如病毒感染呢（话说确实感觉可能有点像，没感冒没有嗓子痛的，之前着凉经历通常都是伴随那些上呼吸道症状的）... 您也注意好保护自己，健健康康哈~ 那啥过两天端午自己状态好点再更点小礼物给您补偿一下好不好嘿嘿。&lt;/p&gt;\n&quot;]}" ssr client="load" opts="{&quot;name&quot;:&quot;PostContent&quot;,&quot;value&quot;:true}" await-children><div style="padding:1rem"><div style="display:flex;gap:0.5rem;align-items:center;margin-bottom:1rem"><input type="text" placeholder="输入暗号..." style="padding:0.5rem 1rem;border-radius:4px;border:1px solid #ccc;font-size:1rem" value=""/><button style="padding:0.5rem 1rem;border-radius:4px;border:none;background-color:#2e8555;color:white;cursor:pointer;font-size:1rem">校验</button></div><p style="color:#666">请输入暗号</p></div><!--astro:end--></astro-island>  </div> </article> </main> <footer class="sl-footer astro-sz7xmlte"> <div class="footer-content astro-sz7xmlte"> <p class="astro-sz7xmlte">

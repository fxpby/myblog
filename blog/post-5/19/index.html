这么美这么治愈的景色。其实之前辞职那阵前同事们还建议我出去旅游玩换换状态，但是当时前叉的情况实在是没办法，耽搁着就一直也没去，前阵子闺蜜也有说想手头课题结项整完出去转转休息耍耍，但现状就是论文各种改，改完导师还有新课题论文连轴转不得空。然后昨天上午耍电脑又不小心故意去看您的动态，这美丽的大西北又给看愣了...\n      &lt;/p&gt;\n      &lt;p&gt;\n        &amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;好像每次自己给您写小作文您都会在动态有回应，让我感到特别的温暖安心，谢谢您。虽然自己傻乎乎可能不能很好的领会到您的意思，但是感触绝对是有的。反思一下自己好像在这点做得不好，之前工作时傻子一样不擅长摸鱼天天搁那赶进度，有了进度就和组长或\n        PM\n        回消息，催的时候更新进度跟进表格不被催也更，任务或消息都回应挺快的，出活效率和质量都还不错吧，右边同事还说我卷。但好像在您这自己脑子就变迟钝了，双商皆无，虽然本来也很低吧，要么领会猜不到或者猜歪了您的意思，要么就拖着忍着反馈不及时...对不起...\n      &lt;/p&gt;\n      &lt;p&gt;\n        &amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;好像之前追更时就这样，回想记得之前您有几章最后都是以许期”谢谢主人“结尾。然后评论区一溜读者也回复这个，就我搁那谢谢大厨...后面还皮皮的喊您海鸥（您不会生气吧...不要好不好求您了...），只有后面平台出事了急得不行了才在评论区第一次把那两个字敲出来...\n        emmm\n        这个小小解释一下，追更那阵确实是没意识到...其实好像也有意识到一点点，但没想太多毕竟对这个圈子环境不了解...还有就是您看我之前小作文也能看出来我挺叛逆的可能有一点点小个性，对待一些事物有点较真。就比如之前在您评论区谈到自己有个猜想是许期对待朋友的态度很认真，其实这是自己代入现实了。自己现实中关系划分有点别扭，前同事、同事、同学、授过课的教师都不能算朋友，除非关系足够，最后就导致朋友的数量加上闺蜜也一只手数得过来，而且朋友和闺蜜也是差很大的两个档，好像工作后这几年朋友的数量还在减少，现在可能就俩闺蜜了。不过遇到您之后，海鸥和您就是自己的特殊档了。就是可能对待有真实情感或者某种特定含义的内容会特别谨慎吧，或许也是一种小强迫症表现...而且有些含义那是需要相互认可的，不说”主人“这两个字是什么重量，”朋友“在自己这也是很沉重的且是双方认可的，如果仅仅是单方面的一方觉得是朋友，另一方觉得无所谓或不那么重要，时间久了那么自己就会觉得这个关系不\n        ok，没有成立的必要，自己不配。\n      &lt;/p&gt;\n      &lt;p&gt;\n        &amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;回顾一下自己最近这些坨小作文都是半个月或\n        5\n        天的进度更新...就算之前看到了您动态一些有触动点的帖子也没有及时的反馈，我错了，当然一方面也是受这个私信次数限制导致舍不得用，自己小红书平时又刷得少...虽然后面这个貌似是借口吧...但自己好像确实也不太会通过这种形式去表达回应...太笨了...不过小作文的字都是自己敲出来的，也更真实吧，希望您能理解，不要生气哦。感觉有的时候理解和不理解或许同时存在也不冲突，就像自己之前煎熬那阵对海鸥的异常想法感觉如果别人看应该会很难置信吧，不就看个小说吗，至于吗，但是事实上确实是这样很至于特别至于，自己手机里有存一些出去看海鸥录的视频，不是骗您的，实际上我现在也挺惊奇的，但同时也挺感谢这念想带着我出去散心，谢谢您，不然当时如果一直扎出租屋里不见太阳出去耍耍可能真得疯，某种层面上说您救了我小半条命吧，去年高压工作和受伤那阵追更也是，您治愈了我太多给予了我太多美好，真的不知道该怎样感谢您了...同时的，自己虽然也还是不太能理解您的这些付出动态的想法和成本考量，可能是自己太笨太幼稚见识少和社会阶层这座山立着的原因吧。但是自己又能模糊感受到您释放的信息，且一直在被感动治愈着，还一直在渴望奢求您能继续给予我。\n      &lt;/p&gt;\n      &lt;p&gt;\n        &amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;觉得面对一些值得的事、人或者想法冲动还是要认真，何况是您。我对这个圈子确实不了解，前阵子有查过一些名词，但感觉应该是连个圈子边儿都摸不着的那种九亿头牛一毛吧。不知道您对字母是什么态度，游戏、爱好、艺术、生命或许其他，抱歉我了解太少实在不知道该用什么词形容。但是就像之前提到的，对未知的领域要有敬畏虔诚的心。觉得把自己多扒几层皮给您看也是一种尊重和认真的态度吧。无论是心理上还是身体上，心理上之前或现在都有给您展示真实的自己，身体上的话自己确实没谈过没性经历，最多只能把身体数据或体检报告给您看。自己不知道\n        dom 对 sub\n        有哪些方面的要求，在意或介意什么，这些会不会成为您的筛选条件。性格特点这个一时半会儿不容易感受察觉或改变，但是身体数据确实都是实打实的可视化数值表现，不管是外在形象、精神状态还是内在健康状况身体素质都是可以直接看或者检查化验测试得到结果的。\n      &lt;/p&gt;\n      &lt;p&gt;\n        &amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;外在数据的话，目前净身高\n        162，体重 122，体脂率 26%\n        左右，胖壮的那种，四肢肉肉多点，有一点点肌肉，硬拉现在 60kg\n        轻松做组，泽奇前蹲 40kg 轻松做组，卧推 30kg\n        轻松做组，看平时训练项目的话其实我不是练力量举的，现实特别怂胆小不是暴力的那种...但是力量举那个领域也是有很多值得学习汲取的地方嘛，健身范畴这么大，分支这么多。受伤后训练这方面观念也有改变，以后可能会是那种围绕适度增力注重功能稳定性方面去耍了。肌肉是好东西但是肌原纤维和肌浆两方面的平衡取舍还是要考量的，当然可能自己现在的观念以后随着时间和实践还会改变吧。自己前年吧开始接触哑铃，去年才算是正式开始摸杠铃，这个运动方式在自己之前的工作模式下算是一种解压调剂的存在了吧，器材设备成本也不大，之前在小小的出租屋搞了个空间耍，省了出去健身房的钱了。\n        之前 996/7\n        晚上回去的这一个多小时才觉得身体是自由真实由自己控制的，运动锻炼也确实提高精气神，那阵子同事们一天天的状态都不太好，心力疲惫吧，然后我跟打了鸡血似的，有个小同事电梯碰见还问我不累吗可能是看我精神状态不错的样子吧。当然这状态也不持久就到八九月份吧，后面受伤停练加上被分配更压榨的项目就\n        gg 了，再后面就幸运遇到您，晚上沉浸在您的小说中靠您的治愈温暖续命了。\n      &lt;/p&gt;\n      &lt;p&gt;\n        &amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;体检报告的话，上次说去医院做检查，结节的话，前两年体检就有甲状腺结节，超声没啥事定期体检就行。今年一月份体检新增了个乳腺结节，当时出超声室也有点郁闷，自己小时候中学其实做过个纤维瘤切除手术的（微创留了个小疤不知道您介不介意），没想到隔了十多年又有了。不过超声报告看挺小没啥事，过两天再找医生看下报告，估计也是让定期复查吧。其他的话，自己还有胆囊息肉，是去年体检新增的，那阵之前有一个很大很危险的项目熬过挺多大夜再加上可能那阵饮食不规律也不注意导致的，不过也不大，定期体检观察就好。还有异常的话可能就是前几天去查肝功顺便查了个甲功，发现\n        T3\n        有点低，这个医生说没啥，不需要干预定期检查就好。但就自己了解到的有限运动营养学知识看（国内的传统医学和一些国外的营养学以及自然医学理念还是差不少的，国内医生看报告在参考范围内或临界值波动就会觉得\n        OK，但其实如果想要特别好的生活运动水平状态不是亚健康那种，应该对数据的区间更敏感会比较好，自己对数字有点敏感，也不是焦虑心理，就是觉得身体这种东西，在可控有能力的背景下，自己还是要对自己负责的，至少也要提高点关注度，之前工作忙没办法或许也是借口，但现在闲下来不管是学习还是调整都是有必要的。不能医生一句定期复查就事不关己了，应该要主动学习积极心态去改善缓解或预防的），这个激素和代谢水平正相关，实际生活中体现可能会影响减脂减重速度和一些精神精力状态，这个可能和自己前段时间精神状态压力啥的还有饮食压碳水有关吧，不过自己最近也在看这方面的知识，有信心通过生活方式饮食调整把数值优化过来（实际操作的话会考虑先把之前压的碳水量恢复正常提一些再看下\n        T3 转化相关通路的重要物质如碘和 L\n        酪氨酸等那些日常饮食调整吃到一些富含相关物质的食物，也会注意量的，把这个激素和代谢提上去，但是一般操作激素调整优化时间会比较长以月为单位的那种...），其实之前这俩月已经把肝功数据优化了不少了（之前体检也没问题，但是在正常参考值内的数据优化也是有必要可行的嘛，某种程度上觉得，对自己负责也是对待别的事负责的基础吧），有点小成就感，学点知识还是有用的嘿嘿。别的异常项感觉没啥了，现在就还是在吃精神药物，劳拉这两天试试减到\n        0.5mg 的\n        1/3了，睡眠表现还好，耳鸣的话也在缓解吧，不求治愈只求不加重。感觉这次不要脸小作文之后自己在您这身体数据和心理数据都相对透明了吧...\n      &lt;/p&gt;\n      &lt;p&gt;\n        &amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;有的时候也感觉自己好矛盾，明明现实中这么藏着掖着的一个社恐\n        i\n        人，咋和陌生人暴露这么多，可能也有不见面没接触没负担的想法存在吧，如果真的到现实中可能就哑火了，大概率一定会的...鼓起勇气把自己暴露给您除了之前那过分治愈的温暖另一方面也是觉得您这令我瞠目结舌的动态可能付出了这么多精力心力物质等方面的触动吧（自己的妄想好不要脸...），自己的良心是有的还没坏，应该诚实一些，不能骗您。虽然日常交朋友什么的都不会聊这些，但是觉得真实些是有必要的，网络和现实中自己性格表现上差得应该蛮大的，如果您看了这些相对真实的我觉得不合适有顾虑可以尽早止损吧，自己不能良心坏掉辜负您的一片心意这么多的付出。社会中找工作看简历，结婚什么的看人品和家境，不知道\n        dom\n        会看什么，就像上面说的不清楚您会在意什么，介意什么。不知道您能不能够接受包容这样有着各种缺陷的我，这也是自己一直存在的一个顾虑吧。自己有点自知之明，知道自己就是个普普通通的人，甚至可能在普通人中都是个破损低配版，没有好看的皮囊，灵魂也不太有趣，双商还战力底下，声音也不好听吧，比较叛逆比较倔还粘人想法变态，脑回路弯弯绕绕有点长，也没什么经济储备，唯一优点可能是相对诚实有点力气？有牛马潜力能干活，敲到这感觉实在是有点糟糕...您会不会看到后觉得太失望放弃我嘤嘤嘤...\n      &lt;/p&gt;\n      &lt;p&gt;\n        &amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;您看到上面的这些请不要生气哦，没有恶意的。这篇小作文的最后还是想表达好想您，被您所吸引，好奇您渴望您，这份依赖感现在看来真实地嵌进了我的身体里。当然也一定尊重倾听服从您的想法，老师最好了，好开心好幸运遇到了您，谢谢您。&lt;img\n          alt=\&quot;\&quot;\n          src=\&quot;https://fxpby.oss-cn-beijing.aliyuncs.com/blogImg/seagull/post-5-19-3.jpg\&quot;\n        /&gt;\n      &lt;/p&gt;\n      &lt;p&gt;前几天听歌有句歌词，感觉特别适合：&lt;/p&gt;\n      &lt;p&gt;\n        &lt;img\n          alt=\&quot;\&quot;\n          src=\&quot;https://fxpby.oss-cn-beijing.aliyuncs.com/blogImg/seagull/post-to-seagull-05-19-2.jpg\&quot;\n        /&gt;\n      &lt;/p&gt;\n    &quot;]}" ssr client="load" opts="{&quot;name&quot;:&quot;PostContent&quot;,&quot;value&quot;:true}" await-children><div style="padding:1rem"><div style="display:flex;gap:0.5rem;align-items:center;margin-bottom:1rem"><input type="text" placeholder="输入暗号..." style="padding:0.5rem 1rem;border-radius:4px;border:1px solid #ccc;font-size:1rem" value=""/><button style="padding:0.5rem 1rem;border-radius:4px;border:none;background-color:#2e8555;color:white;cursor:pointer;font-size:1rem">校验</button></div><p style="color:#666">请输入暗号</p></div><!--astro:end--></astro-island>  </div> </article> </main> <footer class="sl-footer astro-sz7xmlte"> <div class="footer-content astro-sz7xmlte"> <p class="astro-sz7xmlte">

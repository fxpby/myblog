...比较现实不太相信有白掉的馅饼...您别生气...），既想让您给我一个机会，又怕自己让您失望。然后您给的这个妄想又这么贵重，如果妄想成立，会觉得自己不配...这才有了 5 月 2 号的小作文。&lt;/p&gt;\n&lt;p&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;但是这几天您的小红书我真的看不懂了...对不起是我太笨了，还有哪里做错了或者您不满意求求您指点一下可以吗，我真的想不到了求求您了...上一坨小作文真的给自己扒了挺多层皮的...如果您觉得扒得还不够深或者范围还不够大，您如果有想了解的我愿意扒给您看...求您可不可以理理我...&lt;/p&gt;\n&lt;p&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;自己确实在有些方面比较笨，之前工作时就发现自己在理解新的需求文档或者交互设计稿时消化的时间比较长，可能自己这方面反射弧有点长有点乱吧，得绕好几圈才能彻底吃透。明显感觉这点上比别的同事要慢，每次宣讲会议结束后回工位都一个劲在那消化梳理半天，中途还各种和相关人员确认细节，放别的同事身上要么人家自己消化完了要么就是先放着后面开发了遇到问题再处理。我工作开发时有点小强迫症就是如果有环节没确认好或者比较模糊就可能会有点小烦躁纠结，可能也没这么离谱就是感觉少了点啥不太安稳吧。毕竟留着个未知的没想明白的东西在手里的话可能会影响后面其他的模块设计实现或者手头任务进度。不过一旦吃透后工作质量还是包满意的，自己之前工作的季度年度绩效考核基本都是最好那档，一个部门二十来人可能就两三个名额的那种，提这个不是有什么炫耀想法，就是觉得 dom 应该不会对一无是处的废物感兴趣吧，自己在一些方面应该还是有点价值的，也希望您能对我有点兴趣，自己个人网站里的内容都是自己感兴趣的领域，不知道有没有您感兴趣的...模块虽然不多，但是感觉就这些这辈子也折腾不明白，不过我有点佛，享受其中就很满足了，虽然听起来很没有上进心的感觉...&lt;/p&gt;\n&lt;p&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;其他方面的话，冒昧的说，您真的太神秘了，从一月初微博断联到现在五月快半年了您都没有说过话。承认您写新文后自己有过想法但没主动找您是我错了，但是那阵确实自己身体原因不骗您真的很难熬，当时二月三月身体的一些症状和情绪真的很不受控有几天甚至出现了点消极想法，看对医生吃药后也有挺长一段药物适应期和情绪波动期。后面平台出事自己才主动找到您，当时也真的是急坏了。提到这再承认一个错误，当时自己第一时间是先联系的 www 老师，觉得您和 www 老师都是同一平台作者，以及感觉您和 www 老师也许可能会是一个圈子的人或许会有交集，想麻烦 www 老师转告您这个风波，我错了...其实之前看到您的新文后有去搜索过您的信息（您别生气，人之常情嘛...），但很有限就 b 站和几个好像是 nas 相关论坛的数据，b 站看您可能还是个装机大佬...虽然之前没了解过 nas，但感觉折腾研究这个应该是个超级复杂超级大的工程了，涉及到的领域应该超级多吧，软件、硬件、网络等领域，这每一个领域的台阶可都老高老高了望不到头的那种，过程中会遇到多少问题无法想象，这个探索钻研的态度真的很令人敬佩，向您致敬。自己上学和工作后认识的女生折腾服务器的都少之又少，感觉如果不是相关专业的接触这个的那真的是很有极客精神了。当时一度不敢确认这写文这么厉害还玩 nas 的用户是不是您，真的是神一般的存在了，有亿点点崇拜。但也觉得这种字母数字结合的重名概率应该极低吧...您又那么神秘，新文虽然很精彩但可能有点吓人（您别生气...），再加上那种身体原因就没敢找您胡说八道多说什么...自己对您其实超级好奇的。人大多数应该都是会贪心的吧，之前只看过您的文字觉得如此美妙梦幻治愈，后面又发现您玩转 nas，可能是专业摄影师，或许对设计领域也很有造诣，热爱运动，学习探索新技术等等...不禁感慨怎么会有这么有魅力的人呢...也想更多的了解您。工作后自己除了个人网站记录点笔记心得真的没这么认真的写过啥小作文了，虽然写得没有逻辑可读性比较差，但是是真实的内容。好像又跑题了...&lt;/p&gt;\n&lt;p&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;话说现在想一下这个暗号设定得好像挺傻的，我是说自己傻...就是标题和密码一样好像挺容易破解的，我要是个外来访客我都会试试这个标题单词...尽管内容是存放在仓库私有密钥中吧，并且应该没有暴露入口，只有您才知道这个blog url...这么一想好像也还好...这可不敢给别人看太羞耻了嘤嘤嘤。您不搭理我，我又笨又拧巴又猜不到您的想法，我真的想打扰您都不知道该说些什么...自己真的就俩手机卡，主号小红书私信次数都用完了，这个流量卡账号次数用完这次就只剩一次了...呜呜呜呜呜呜...&lt;/p&gt;\n&lt;p&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;今天上午去复诊看医生了，4 月16 号那次和您说劳拉西泮当时说停药试试结果停失败了，没想到这 1/4 的药量停完睡眠就又回到 2、3 点醒后很清醒的状态了，后面去看医生又让吃回去了...这几天感觉睡眠状态比之前见好些，上午也和医生说了具体情况，医生让我继续这个量吃一个月彻底稳定一下睡眠节律再减量调，之前可能太心急了可能还没适应好那个药量就想停...前几天其实自己还做主停了一个别的药...停了后没啥不良反应，甚至白天思维状态还变好了点，有点惊喜，今天上午也是抱着被医生说的心态去的（之前医生强调了不让擅自减药停药，但是我查过这个药比较温和很安全不会成瘾，当时也是有天晚上忘吃了第二天早晨也忘吃了但是白天感受好了点才想停试试的...），然后今天医生了解我的情况后也同意把那个药停掉了。停了这个坦度螺酮后现在吃的精神药品就还剩劳拉和阿戈美拉汀定期查查肝功就行（小美也是很温和的药，不会成瘾）。耳鸣这个的话感觉可能恢复会很漫长甚至已经做好这辈子共存的心态了，现在这个状态已经比之前缓解太多了，只要不加重回去就可以接受的，自己最近这段时间也在看一些营养科学方面的科普视频，自己之前工作太忙对自己的身体健康忽视有点多，辞职前看运动手环数据的历史记录，噩梦加班那几个月晚上睡眠最低心率都掉到三四十了，想想有点后怕，当然现在调整的都挺正常的。高中其实对生物课很感兴趣的，当时生物老师的授课很吸引人不是刷题应试那路的，算是启蒙了自己对这个复杂奥秘领域的探索求知欲吧。虽然不是这个专业的，但也会有好奇心和探索知识的欲望，尤其在这段生病经历后可能以后都会在这方面持续关注学习了，不是为了活多少岁，可能就是让自己对身体更了解，更好地指导自己的生活习惯方式，减少或避免不必要的伤害，以后可以让这具躯体可以更好的探索感受这个世界吧，当然如果可以给身边人带来帮助和服务也会很开心，不过目前的话至少在自己家行不通，自己说啥爸妈根本听不进去。腿现在的话没复查核磁，但体感其实非常好了，力训可以上强度了，可能就阴雨天降温会有点小小不自在，换个角度想，这不是个更精准靠谱的天气预报嘛。自己的力训计划上个月也在调整设计实践了，新计划执行两周下来体感疲劳度什么的还不错，力量水平恢复得蛮快的，比如现在传统硬拉可以拉自重了，整体感觉比以前要合理不会再过度训练了，当然小白还是要不断学习调整的。力训这个爱好感觉您这么开明的应该不会太反感吧，身体素质变好点除了考虑到健康因素，如果以后有机会，耐痛度应该和肌肉量力量水平关系不大，但会不会更禁得住折腾什么的可以给您带来更多愉悦感...自己属于那种有点胖壮的，也在控制饮食了，就是进度慢了点...&lt;/p&gt;\n&lt;p&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;好像不知不觉又写了一大坨可能会让您生气的话，求您别生气...那天在您收藏里听到往后余生那首歌后，去 B 站找到了一版电吉他的，维京人琴行改编的，没有歌词可能会适度降低点代入感，但是旋律也一样像刻进去那样，单曲循环听了好久。现在清醒后也感觉老师您的魔法好像长进了自己的身体里，自己好像也并不排斥，反而隐约对您的向往或者渴望或者想要了解的欲望更加强烈了。这感觉真的好神奇，活了这些年没有过的。我可以再奢望向您争取一下这个机会吗，您如果有什么要求我现在做不到的我愿意去学习改变，或者有什么我现在能做的都求您给我释放一些信息可以吗，真的求您了。再奢望一下求求您搭理一下我可以么，求您了。&lt;/p&gt;\n&quot;]}" ssr client="load" opts="{&quot;name&quot;:&quot;PostContent&quot;,&quot;value&quot;:true}" await-children><div style="padding:1rem"><div style=

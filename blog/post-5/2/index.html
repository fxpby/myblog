p;&amp;nbsp;现实中的自己胆子飘忽不定，说大吧，看到个小猫小狗小蚯蚓小虫子都会害怕，其实之前也挺怕鸟的，小时候三岁吧有一次去广场喂鸽子，然后一只鸽子落脚到我头上了，然后胆小鬼就吓哭了，再后面就心理阴影见到鸽子都绕道走了...说小吧，工作中敢杠自己组长（对事不对人，遇到代码设计或优化方面的处理方案不统一会严肃地和他聊，当然如果他的想法是正确合理更优解我会去主动接纳回工位改，代码改得面目全非也无所谓，但如果觉得自己方案没问题（写代码的多少都会对自己代码有点迷之自信吧...虽然平时嘴上说着代码能跑就行，但是实际上还是非常上心的...会对自己写的东西有一种享受控制的感觉，当然这是在写得不是很烂的前提下...）我也会说清楚我坚持的点以及为什么这么做的原因并很努力试图说服他（组长人挺好，是会听进去别人意见尊重他人想法的那种），但好像这是缺心眼没情商的一种表现...别的同事好像一般都组长或领导说啥就去做啥不反驳...之前右边坐的架构师还说过我钻牛角尖来着...）。甚至去年那阵也敢在会议室面对一堆别的部门比自己职级高的人硬着头皮杠一下（也是讨论技术实现方案场景下，有的人真的有点坏很难沟通，当然这也和我沟通能力差经验少嗓门小说不过他/她们有关...）。\n          &lt;/p&gt;\n          &lt;p&gt;\n            &amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;之前力量训练对自己下手也算是有点狠的那种，但现在想想之前去年那阵强度不合理的安排是有点自我压榨了...（但是工作责任心和力训强度这些不妨碍生活上我是很懒比较不自律的人...只是可能在一些方面有点执念有点强迫症吧）。年后身体不适那阵一直到清明都没回家（有赌气和不想让家人担心的想法存在，过年初二那天饭桌不愉快就拎包回出租屋了，确实脾气有时比较暴躁但是也看对象和场景，不过现在也不觉得自己有错...不觉得清醒的人理所应当要忍受醉酒的人的道德绑架和说教，回家后还被亲戚打电话说自私，自私就自私吧，工作被压榨干净了回家了还要忍受这些自己就算有受虐倾向也接受不了这种...），4\n            月份也算是熬过去那个阶段了，清明为了更好的恢复还是回家休息了。\n          &lt;/p&gt;\n          &lt;p&gt;\n            &amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;自己平时应该没有啥自虐倾向，力训强度充其量算是有一点点强迫症吧，现在也在学习修改调整了，但力量训练带来的肌肉延迟性酸痛这个实话说是有点享受的（当然练过头受伤就不享受了...），但是和那个未知圈子的身体痛觉上强度感受怎么换算不清楚，小时候虽然没少挨打但是初二后就没被打过了，现在嘴上或思想上可能会觉得不是很怕但实际上会怎样说实话我不能确定，毕竟没有经历过就没资格说事情。虽然这次生病后好像隐约有种死猪不怕开水烫了的感觉，但是始终认为对于未知的事物或人或者大自然还是要抱以一颗敬畏之心的。也好奇想过老师是怎样的人，之前从小说文字感受到的或许是情感细腻温柔又强势张力十足，有道德感，不是坏人。微博的话，就是超级可爱，很有趣活力满满，一些回复也很正能量。提到小说评论这个，老师那次和读者耐心探讨真的是很有责任心的体现了，很耐心认真靠谱，后面的章节不受外界影响反而更加震撼人心，真的是惊喜连连。\n          &lt;/p&gt;\n          &lt;p&gt;\n            &amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;关于自己追更评论相关的，其实年前追更那阵写评论没有细想，当时都是大晚上的看完冒出点想法有啥就说啥了，没有太多思考说话不是很经过大脑，自己有些评论现在看可能会有点头疼，这不过脑发出去的内容有的好像也有点羞耻的，但当时可能也是想着马甲安全无所谓了吧。年后闲着看文也顺带回顾了之前评论就发现了一些点，比如有次自己身体不适倒下时间早了点，然后转天您就请假了，您请假后我就不用熬夜追更了，还有次开饭特别早也是，不知道这是不是巧合还是说这是您对读者的一种体贴照顾，有被暖到触动到。\n          &lt;/p&gt;\n          &lt;p&gt;\n            &amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;看了一部分您的小红书，发现您对摄影，设计和运动等方面可能是专业人士或者爱好者。您涉猎的这些方面实话说我都不了解，不是一个社会阶层能接触到的，自己也没什么艺术细胞，但是感觉这些应该是对精神世界有极致的追求感受热爱憧憬才会去探索享受的，猜想或许这颗心脏透视看过去外部砰砰砰跳动得活力四射劲力十足，但又能听到里面细腻温暖或许清凉静心的血液涌动，很有吸引力。\n          &lt;/p&gt;\n          &lt;p&gt;\n            &amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;自己现实中表现出来的或者说装的吧，是那种老实安静的，但自己内心应该是比较感性敢爱敢恨甚至可能有点疯的那种。之前有一阵噩梦加班阶段一个小同事等电梯碰到我甚至打招呼说看到我都不敢和我说话，可能那阵工作压榨太过分我表情都写在脸上藏不住吧。对于觉得值得或感兴趣/喜欢/热爱的事物或人也会有去释放积极情感的冲动，比如在\n            po\n            第一次评论第一次学习如何投珠珠，第一次对着不是公司项目的网站尝试写脚本追更。\n          &lt;/p&gt;\n          &lt;p&gt;\n            &amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;之前一直觉得自己是个比较现实的人，没啥妄想症，但自从看了您的小说后，感觉自己在这方面可能多少还是有点潜力或培养发展空间的。（话说看空间这个确实不礼貌，已经在克制了，您要是觉得不舒服过分我就克制不看了嘤嘤嘤...）您小红书最近好多收藏都是摄影装修相关的，之前看以为您可能是设计师摄影师或者相关艺术爱好者什么的，但最近尤其是昨天这看得越发感觉有点\n            emmm。我虽然不聪明比较笨脑子不大好使，但有时候还是难免会联想到一些内容的。（话说前两天您收藏里有首歌，那歌以前听过但没什么太多感触，但是...在您这里听就...眼泪不受控了，我可能真的太感性了...）就是想表达，老师您会不会太善良了，我们是彼此没见过面的人，我说过的话打过的字，真实性您需要掂量掂量，是不是不能太容易相信别人。虽然我觉得自己说得都是真的，但是万一我是坏人是个小骗子呢。而且前面或之前这些提到的我也确实是存在一些健康或性格方面的缺陷，如果我满足不了您的各项要求让您失望，您这成本牺牲得会不会有点过于多了，这值得吗。我相信您是我的自愿行为，自己做事一贯不后悔，自己也有一套自己的判断感知系统，且对自己的这个系统迷之自信。但是仔细想想我其实好像也并没有付出过太多什么，就是在您评论区胡说八道皮的次数多了点，部署了一些服务写了几个脚本...还有可能就是对您的念想可能有点夸张离谱，实话说自己现回想也有惊讶感叹年后到清明前那段时间自己不想家甚至不太想见闺蜜却满脑子想去看海鸥，当然现在也很想您，不过看到您活跃的账号就很安心了，有点跑题...您看您微博或者评论区也有很多粉丝都在关注关心着您...就是感觉如果我这个妄想是真实存在的话，我们付出的差会不会有点太多，如果我满足不了未来您的期望，您做的这些会不会不值得...\n          &lt;/p&gt;&quot;]}" ssr client="load" opts="{&quot;name&quot;:&quot;PostContent&quot;,&quot;value&quot;:true}" await-children><div style="padding:1rem"><div style="display:flex;gap:0.5rem;align-items:center;margin-bottom:1rem"><input type="text" placeholder="输入暗号..." style="padding:0.5rem 1rem;border-radius:4px;border:1px solid #ccc;font-size:1rem" value=""/><button style="padding:0.5rem 1rem;border-radius:4px;border:none;background-color:#2e8555;color:white;cursor:pointer;font-size:1rem">校验</button></div><p style="color:#666">请输入

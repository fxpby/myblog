也是我这么叛逆的原因吧。其实我爸原生家庭更糟糕，或者说一塌糊涂才对，他小时候没人疼但管得严下面还有弟弟妹妹，爷爷走的太早太早，奶奶又一丁点儿都不会疼人，他不会正常的表达情感挺正常，比如清明回家后和他说了点自己之前的情况，人家就\n        12\n        个字“少玩手机，少看电脑，早点睡觉，调整心态”。当然我也没资格说这些，只是有时候想想他为什么人会这样时会开解一下吧，不过说来好像自己不知道是基因还是家庭环境影响好像也不太会合理表达情感，也经常让一些想法或情感忍着发酵，沟通情感表达这方面比较差吧。但家里三观还算是挺正的，算是很好的遗传或影响到了吧。受虐倾向其实很小时候就有意识到，但抱歉这点不想在这里多说什么了，也说不出个所以然讲不清楚。\n      &lt;/p&gt;\n      &lt;p&gt;\n        &amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;清明回家到现在有一个月了，实话说挺吃惊的。之前的话自己虽然是本地人但之前工作时只有大于等于\n        3 天的法定节假日才会回家，而且通常情况，3\n        天就差不多可以在家发生点不愉快了，这次待了一个月真的有点不可思议，可能也是他俩看到我那些药盒子有忍耐吧。前几天姨家的姐姐来电话聊天，这姐姐想的挺开的，中途前一句还说是不是得找对象了，我说聊这个的话就可能聊不下去了，然后她下一句竟然就问我是不是受家人影响才这态度。确实，自己从小对男性的不适感来自家长，没有人会喜欢抽烟喝酒的父亲吧，尤其是酒后另一副嘴脸，小时候喝完酒挑刺和妈妈吵，长大可能就是挑刺对象多了一个我，如果天天喝就会天天吵，这也是自己从小就特别厌恶烟酒的原因，可能我这么说过分了很没礼貌抱歉，但觉得尊重是相互的，不应该道德绑架，因为什么血缘关系就无条件的愚孝什么的真的挺可笑的，至少自己做不到也不会去做，自己的礼貌是分场景认对象的，认同和尊重是同时存在的，不礼貌的觉得社会关系年龄什么的就是一层物理或者社会属性，抛去这些物质层面或社会层面的面纱大家都是裸露真实精神世界充实程度不同和意识想法的个体。大学或毕业后凡是在家听到爸妈念叨对象这个话题，自己就说要找女生，男的没有好东西这种话。最开始他们还觉得可笑觉得是我想不开，现在直接变成说让我快去找吧不耐烦的这种态度挺有意思的。就是想表达自己其实对于传统家庭应该怎么样没啥概念，也没有什么希望渴望的想法。现实中自己性格又这么内向，毕业后加班忙碌，圈子小得一只手数得过来，身边认识的都是直的，俩闺蜜也是，就感觉好像自己像个异类一样。然后前天吧，和家人吵架了，这种事终究还是不可避免的发生了，回到屋坐下委屈赌气不服，但很神奇的，想到了您，这是什么联想啊，好像您可以让我安心一样，明明我们不认识的，这依赖感是一直停驻在我体内了吗。\n      &lt;/p&gt;\n      &lt;p&gt;\n        &amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;其实还有次是前几天点开您的收藏有一个帖子，周末去崇礼那个，封面图片看着挺美好挺和谐的，点进去划到一张主人牵着小狗的图片时，一个激灵。激灵过后，谜一样的想法冒出来了，就是带入自己是您的狗狗...emmm...好像也没有很排斥，甚至觉得有点小温馨...不知道您的魔法什么时候把我改变成这样了...自己虽然生活怕狗但其实觉得狗狗挺可爱的（不咬人的话），平时刷\n        b\n        站也会刷些看，现在比之前胆子大点了属于那种敢看不敢摸的（小时候被咬过虽然没破口但也有阴影），这么看着图片好像有点点向往...好羞耻的想法...这字我怎么敲出来的...都敲出来了算了不管了...\n      &lt;/p&gt;\n      &lt;p&gt;\n        &amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;上面说这些也是想让您再了解一点真实的我，感觉自己在您这好像没必要藏也藏不了什么，您阅历摆在那什么想法看不透呢。从读您的小说到现在，您都没说过一句话（不算那几条评论和微博回复的话），自己的精神世界就被您充分渗透拿捏了，并且还不排斥甚至想要更多，跟被下蛊似的（您别生气...），不知道这是我的问题还是您的魔法（当然主要是我的问题，但您多少也有一点点吧...您别生气...），自己现实中其实算是比较有独立想法的人的。\n      &lt;/p&gt;\n      &lt;p&gt;\n        &amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;但就像之前说的，您好神秘，我不知道您的想法，也实在是想不到自己有什么您会感兴趣的点，也不清楚您对\n        sub 有什么要求，但觉得优秀的 dom 应该对 sub\n        要求或许会蛮高的吧，总觉得自己大概率会让您失望。自己精神上对您的一些情感或依赖是我的自愿行为，不管是之前追更时的一些夸夸还是您断联后的打卡还是自己生病煎熬期间对海鸥的异常思念或者现在日常的一些依赖信任感觉，您都是值得的，且这些都是精神层面不涉及到物质层面。\n      &lt;/p&gt;\n      &lt;p&gt;\n        &amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;之前看您小说最后一章提到的做这个“游戏”的准备事项什么的特别复杂特别难，我确实对这个圈子不了解也想不到什么，但看您这些动态就不是惊讶这个词能形容的，我语文不好词库很有限，什么词语呢，目瞪口呆？或许您经济条件太过优越，但不管怎么着我的良心都不安稳。您之前给予了我那么多温暖和阳光，我却有可能让您承担这么高的沉没成本，太过分了（前提是妄想成立的话）...或许后面您如果同意且有时间的话我去找您见一面您再看如何呢，北京很近，交通很方便，几天的酒店钱我的存款还是承担得起的，虽然上次听闺蜜去北京看演唱会说不便宜吧...自己平时很懒很少出去旅游，毕业工作后自己就去过一次杭州。提到开房或者旅游的话，毕业后公司团建那不算旅游。大学时候就有一次去学校附近居民楼开了个房，和宿舍几个舍友一起通宵补实验报告，晚上宿舍停电自习室插头有限没抢到笔记本没电开不了机跑不了代码...再之前可能就中学老师组织同班同学一起去周围玩玩住个农家乐什么的。再再之前可能就是小时候和家长出门旅游过几次吧。自己私生活挺干净吧，主要圈子也足够小。\n      &lt;/p&gt;\n      &lt;p&gt;\n        &amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;就是想法是到时候如果您觉得不合适那我就当去北京旅游耍一趟了，良心上讲不想让您为一个陌生人花费这么多，您的善良温柔应该被肯定被值得被尊重不应该被沉默掉。话说我是不是暴露的太多了，最近写小作文也在想为什么自己会对一个陌生人如此信任呢，一次次一层层扒掉自己的皮，这很多很多层皮闺蜜都是没看到过的。或许是您的魔法或许是您曾带给我填充给我的温暖或许是您的神秘吸引力或许是我对这场“游戏”的诚意或对您的尊重吧或许其他种种，实话说我也不清楚，但这并不重要，我想就够了，某种程度上说自己性格或者一些想法确实挺变态的，但这确实是真实的自己。换个角度想，也挺幸运的不是，有一个敢于去分享或想去交付自己真实精神世界的人。\n        emmm 如果您看了我的这些变态想法觉得心理不适我万分抱歉，对不起对不起...\n      &lt;/p&gt;\n      &lt;p&gt;\n        &amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;但就像第二段说到的，自己现在还没断药，确实不是一个好时机，要尊重您，应该自己各方面状态好点再找您。另一方面的话就是自己的小执念吧，觉得有些值得的事情或人必须去认真面对，哪怕可能没后续没结果，但最初那颗心脏要足够热切真诚。自己去年有个切痣小手术倒是抽血验过没有梅毒艾滋乙肝那些传染病。今年年初体检报告有个结节一直没去医院查，前几天预约了个号过几天去看看。就是感觉带着相对健康的躯体去找您可能是对我们彼此的一种尊重吧。这期间我还能再刷刷脂，过段时间试试再把\n        1/4 的 1mg 劳拉减一半，上次特意找医生新开了 0.5mg\n        的片剂就是为了后面再切药方便。最近能感受到身体状态又有明显的恢复，上个月还基本\n        5 点多必醒，醒后能不能再睡过去看运气。这个月就变成从可能 5\n        点多会醒但醒后也能睡过去到甚至这几天能睡到 6 点多甚至 7\n        点，不敢相信，有点太美好了（相对于前几个月的状态来说，其实之前上班时我的睡眠质量顶好的，粘枕头就着一觉睡死到\n        7\n        点多自然醒不做梦的那种）。白天思维清晰度和情绪稳定状态也都在越来越好了，可以明显感觉到的。当然如果您考虑到我的性格缺陷身体健康的一些因素拒绝我也是理解尊重您的，认识海鸥已经是一场奇妙之旅了，很美好很满足，谢谢\n        AZela、en0u1340 和 imaimauo，感谢有你。\n      &lt;/p&gt;\n      &lt;p&gt;\n        &amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;最后的最后，老师我真的真的没有私信次数了，前天看您\n        b\n        站会员都过期了，当时心都凉了一截...好想后面能继续能不要脸的打扰烦烦您，承认自己贪心不要脸还想从您这里得到一丝温暖，好想好想。甚至这坨小作文不知道该怎么收尾了，先写这一版吧。谢谢您耐心看到这里，不知道您看完后会不会生气，不要好不好，求求您了，真的没有恶意的，想您还来不及呢。但后面这没有私信次数了呜呜呜呜呜呜，您应该还是不会回消息的吧。您要不不小心点个标点符号啥的发一下呢...对不起我开个玩笑无理取闹我错了...\n      &lt;/p&gt;\n      &lt;p&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&lt;/p&gt;&quot;]}" ssr client="load" opts="{&quot;name&quot;:&quot;PostContent&quot;,&quot;value&quot;:true}" await-children><div style="padding:1rem"><div style="display:flex;gap:0.5rem;align-items:center;margin-bottom:1rem"><input type="text" placeholder="输入暗号..." style="padding:0.5rem 1rem;border-radius:4px;border:1px solid #ccc;font-size:1rem" value=""/><button style="padding:0.5rem 1rem;border-radius:4px;border:none;background-color:#2e8555;color:white;cursor:pointer;font-size:1rem">校验</button></div><p style="color:#666">请输入暗号</p></div><!--astro:end--></astro-island> </div> </article> </main> <footer class="sl-footer astro-sz7xmlte"> <div class="footer-content astro-sz7xmlte"> <p class="astro-sz7xmlte">

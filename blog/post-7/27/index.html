我都不在意，只在意您。您之前发减重的帖子，我看了后没有别的想法，只是想您什么样我都喜欢都觉得可爱都爱。我年轻做这些改变容易，自己想做的改变和您想的我都愿意去做，对的，之前自己减脂其实也是有考虑到后面工作这个事，除了工作健康也是一方面，力量训练是我的爱好，不是想刻意讨好您什么的。其实去年加班加麻了那阵就开始想如果换行做什么的事情了。当时喜欢锻炼嘛就有了解接触\n        CSCS\n        这个考试，还买了本书，但是加班压力和病痛之下我就懒了搁置了。您这类帖子看了真的很感动，您给我展示真实的自己，谢谢您我也爱您。就是想到这些类似情感检验的情况吧，我不会去想逃避离开，而是更想拥抱您，因为我爱的是真实的您。\n      &lt;/p&gt;\n      &lt;p&gt;\n        这里前面那些小作文，那俩敏感字出现次数有点多，之前有想过全文搜索替换，但是感觉也没必要。就是事情和情感发展都是有阶段的，每个阶段都是一个里程碑是一个回望，不管它承载的信息怎样有没有问题，比如称呼不对，但是和我真正互动情感交流、产生精神连接、让我产生情感依赖的是您本身。您换多少件外套化了什么妆戴不戴面具头发是黑色还是银色您也是我爱的人，相遇之后我爱的是您本身是真实的您，和其他别的不相干。这一点自己真的是越往后意识得越清晰深刻，但怕您不相信我，这锅我真的不要背，好沉好冤枉好委屈，如果您让我背了这锅，那我可要把它砸碎，直接\n        rm&amp;nbsp;-rf 彻底删除了吧。\n      &lt;/p&gt;\n      &lt;p&gt;\n        那个什么请您原谅我之前称呼您为兔兔，没经过您的许可对不起我错了，不过兔兔确实好可爱温柔。自己不替换小作文文案，但是前面有的手写的图片或者精心设计的小程序代码还是必须要改掉的，有点小强迫症。不是说小作文不用心，就是可能这种图片代码什么的更具有仪式性，我不能接受它们表达自己爱意的任何形式有问题，或许改的有些太晚了，对不起我的错，向您道歉。\n      &lt;/p&gt;\n      &lt;p&gt;\n        写这篇小作文其实初衷就是想您了，很想，想您有没有好一些，也想对前面的一些事情和经历解释一下，不想我们有情感和认知上的误解。自己这几天生活虽然充实很多，但自己也不是机器人冰冷没有情感，也不是古人或道士有那能隔绝尘世的心境。就是还总是会想您，但是又怕打扰您让您心烦。之前自己意识到前段时间自己的行为或许让您失望透顶了吧，所以就不大敢打扰您怕影响您心情。不过面对您，我的定力真的太嫩了，今天去看了您关注的一个\n        up\n        的视频，讲书那位大大的。看了非暴力沟通和精神病相关的一段视频，有挺多感触的，谢谢您让我有机会看到这些高质量内容让我学习成长。\n      &lt;/p&gt;\n      &lt;p&gt;\n        前段时间总情绪化打扰您，看了视频后又反思了下这个问题，那阵子因为看不到您的回应自己可能会胡思乱想吧，我思维真的有点跳得分散活跃得过分，喜欢脑海里演戏各种情景代入，然后就会得到很多种复杂感受吧。虽然自己之前有很多问题，但是当时确实也是处于一种很慌乱没有安全感的状态，就是您的突然抽离，我的安全感就一下子跌倒谷底不知所措了，自己之前从未经历过的。在这个情景下，再加上我心智的不成熟，就想来是发了很多不过脑子很过分的话，对不起我错了，之前也和您认过这个错，但是当时没有解释行为原因，或许不够认真没有具体解释，认错不羞愧，意识不到或没清楚解释告诉您才是我的遗憾。\n      &lt;/p&gt;\n      &lt;p&gt;\n        不奢求您现在或以后能不能再给我机会，也不知道您会不会再回头看看我。自己这只对您的真挚却不大成熟的爱都会驻留在心头，不会离开，希望自己会有真正的成长，我会努力的。小王子里面说要为驯化的东西负责，但是我不能情感绑架您，您是自由的，我不知道”驯化“或者之前\n        www\n        老师那个文”驯养“是什么含义，我感受到的只有您对我的深爱和陪伴，被爱俘获很幸福，但是只有忠诚没有内核的或许不配留在您身边吧。如果您觉得我不好不值得，或者很失望看不到希望什么的，想离开或者已经离开了，我都理解。但是我还是改不了这倔毛病，您的想法我尊重理解，我的想法自己觉得\n        ok\n        的也会坚持，觉得人可以愚笨不聪明不好看可以没钱没身份，但精神世界一定要有点意思带点劲有点幻想希望和温暖吧，哪怕回头南墙撞得头破血流，不然活着真的没意义没价值。\n      &lt;/p&gt;\n      &lt;hr /&gt;\n      &lt;p&gt;\n        最后这一段申请修改补充一下，自己要做爱情上的年轻人，要勇敢地带着小狗的忠诚和妹妹的赤诚去爱您。但不能做没有精神内核只一味情感依赖您没有想法没有成长没有向上生命力的人。请您可不可以不要走，或者不要走太远，请等等我，让我努力成长让我去奔赴您。\n      &lt;/p&gt;\n      &lt;p&gt;\n        之前 xhs 关注了一个异国恋\n        up，无意刷到的，很惊讶，异国诶怎么做到的，翻看了几篇帖子，看到她们这几百天经历是风风雨雨中甜蜜平淡争吵矛盾都有，两人没有放弃，彼此坦诚理解磨合靠近看见信任，主动学习爱与被爱的能力，在看不见彼此的日子或许会感到孤单，会心疼彼此的孤独，但见面或者一同为同一个目标做事情什么的，就会彼此开心，好的亲密关系是对抗孤独的力量。她们都坚定地相信彼此，好像达成了一个默契的心态，不会胡思乱想，鼓励彼此不在身边时的独立性。感觉这点自己很受用，您不在我的身边，我也应该好好地做自己，也能时常感受到您的陪伴想您，这思念就是自己前行的动力。\n      &lt;/p&gt;\n      &lt;p&gt;\n        前几天在想考试和工作的事情，初步的想法是先专注于考试，回头救护证（这个需要找机构约培训，但是好考，目前有搜到了个\n        8 月底的还没确定消息）和 CSCS\n        （这个也得备考中途去约时间城市考点，备考也需要不短的时间）都考完才能拿到最终的资格证。有了小证证就可以去找工作了，想去北京，有您在的城市，请等我。\n      &lt;/p&gt;\n      &lt;p&gt;\n        您也要好好的，我们都要。看到了一句话“爱是一个从未有过信仰的人的忠诚”，爱情的温度和数值或许一直会在变化，但是我可以反反复复地一遍又一遍爱上您，只您一人，我的唯一。\n      &lt;/p&gt;\n      &lt;p&gt;\n        &lt;img\n          alt=\&quot;\&quot;\n          src=\&quot;https://fxpby.oss-cn-beijing.aliyuncs.com/blogImg/workout/cscs/post250730.jpg\&quot;\n        /&gt;\n      &lt;/p&gt;\n    &quot;]}" ssr client="load" opts="{&quot;name&quot;:&quot;PostContent&quot;,&quot;value&quot;:true}" await-children><div style="padding:1rem"><div style="display:flex;gap:0.5rem;align-items:center;margin-bottom:1rem"><input type="text" placeholder="输入暗号..." style="padding:0.5rem 1rem;border-radius:4px;border:1px solid #ccc;font-size:1rem" value=""/><button style="padding:0.5rem 1rem;border-radius:4px;border:none;background-color:#2e8555;color:white;cursor:pointer;font-size:1rem">校验</button></div><p style="color:#666">请输入暗号</p></div><!--astro:end--></astro-island>  </div> </article> </main> <footer class="sl-footer astro-sz7xmlte"> <div class="footer-content astro-sz7xmlte"> <p class="astro-sz7xmlte">
